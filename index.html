<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Avatar</title>
  <style>
    html, body { margin: 0; height: 100%; background: #d8d8d8; }
    canvas { display: block; width: 100%; height: 100%; }
    #mosse { position: fixed; left: 12px; bottom: 12px; display: flex; gap: 8px; }
    button { font: 16px sans-serif; padding: 8px 14px; }
  </style>
</head>
<body>
  <div id="mosse"></div>
  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.170.0/build/three.module.js" } }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "https://unpkg.com/three@0.170.0/examples/jsm/loaders/GLTFLoader.js";
    import { avatar, play } from "./avatars.js";

    const spec = await avatar("druido");
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xd8d8d8);
    const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(0, 1.1, 3.2);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(devicePixelRatio);
    document.body.prepend(renderer.domElement);
    scene.add(new THREE.HemisphereLight(0xffffff, 0x888888, 1.2));
    const sun = new THREE.DirectionalLight(0xffffff, 1.4);
    sun.position.set(2, 4, 3);
    scene.add(sun);

    const gltf = await new GLTFLoader().loadAsync(spec.url);
    const model = gltf.scene;
    const box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());
    model.position.sub(box.getCenter(new THREE.Vector3()));
    model.position.y += size.y / 2;
    scene.add(model);

    const mixer = new THREE.AnimationMixer(model);
    const bar = document.querySelector("#mosse");
    for (const name of spec.clips) {
      const b = document.createElement("button");
      b.textContent = name;
      b.onclick = () => play(mixer, gltf.animations, name);
      bar.append(b);
    }
    play(mixer, gltf.animations, "idle");

    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
    const clock = new THREE.Clock();
    renderer.setAnimationLoop(() => {
      mixer.update(clock.getDelta());
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
